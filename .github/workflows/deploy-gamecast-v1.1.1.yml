name: Deploy GameCast V4 Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-gamecast-v1.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamecast-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated V4 release
        uses: actions/checkout@v4
        with:
          ref: 6797f93d1927360c4a3b88b77b5fc507289bb748

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static GameCast
        run: npm run build:pages

      - name: Verify preserved and V4 surfaces
        run: |
          test -f out/index.html
          test -f out/week2/index.html
          test -f out/v4/index.html
          test -f out/v4/boxscores/index.html
          grep -q "PC-GAMECAST-v1.1.1" out/index.html
          grep -q "GAMECAST" out/week2/index.html
          grep -q "GAMECAST V4" out/v4/index.html
          grep -q "V4 BOX SCORES" out/v4/boxscores/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
