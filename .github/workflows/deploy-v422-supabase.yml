name: Publish GameCast 4.2.2 Supabase Staging

on:
  push:
    branches:
      - release/gamecast-v4.2.2
    paths:
      - 'supabase/functions/gamecast-week3-v4-2-2/**'
      - '.github/workflows/deploy-v422-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamecast-v422-supabase-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: gamecast-v422-supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: percrnamjzetzjjuxuuw
      FUNCTION_NAME: gamecast-week3-v4-2-2
    steps:
      - name: Checkout GameCast 4.2.2
        uses: actions/checkout@v4
        with:
          ref: release/gamecast-v4.2.2
          fetch-depth: 1

      - name: Verify deploy source
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN repository/environment secret is not configured'; exit 2; }
          test -f supabase/functions/$FUNCTION_NAME/index.ts
          test -f supabase/functions/$FUNCTION_NAME/power.ts
          test -f supabase/functions/$FUNCTION_NAME/week3.ts
          grep -q 'GC-W3-V4.2.2-RC1' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'w3v422-' supabase/functions/$FUNCTION_NAME/index.ts
          cmp supabase/functions/gamecast-week3-v4-2-1/power.ts supabase/functions/$FUNCTION_NAME/power.ts
          cmp supabase/functions/gamecast-week3-v4-2-1/week3.ts supabase/functions/$FUNCTION_NAME/week3.ts

      - name: Publish isolated 4.2.2 Edge Function
        run: |
          npx --yes supabase@latest functions deploy "$FUNCTION_NAME" \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Smoke test published runtime
        run: |
          set -euo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}?api=read&session=w3v422-publish-smoke"
          code=$(curl -sS -o smoke.json -w '%{http_code}' "$url")
          cat smoke.json
          test "$code" = "404"
          grep -q 'GameCast 4.2.2 Week 3 session not found' smoke.json
          echo "4.2.2 Supabase staging publish smoke test PASS"
