name: Publish Week 5 Light Scoreboard 1.3

on:
  push:
    branches: [release/scoreboard-ui-v1.3-w5-light]
    paths:
      - public/scoreboard/v1.3/**
      - .github/workflows/deploy-scoreboard-v13-light.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scoreboard-ui-v13-w5-light-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Protect the engines and earlier routes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/scoreboard-ui-v1.3-w5-light
          git diff --exit-code 80bc82fe36ff272182230b3728b686f2f6b7b501 -- supabase release-assets public/v4.3.2.1 public/v4.3.2.2 public/scoreboard/v1.0 public/scoreboard/v1.1 public/scoreboard/v1.2
          cmp public/scoreboard/v1.2/scoreboard.js public/scoreboard/v1.3/scoreboard.js
      - run: npm ci
      - name: Build retained GameCast routes
        run: node scripts/build-gamecast-v4322.mjs
      - name: Check scoped light theme
        run: |
          node --check public/scoreboard/v1.3/scoreboard.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const css=fs.readFileSync('public/scoreboard/v1.3/scoreboard.css','utf8');
          const html=fs.readFileSync('public/scoreboard/v1.3/index.html','utf8');
          assert.match(css,/--bg:#ECECEC/);
          assert.match(css,/--text:#000000/);
          assert.match(css,/\.game-head \.state\{font-size:10px/);
          assert.doesNotMatch(css,/#(?:fff|ffffff|f4f6f8|e5e8ec|e9edf1|d7dbe0)\b/i);
          assert.doesNotMatch(css,/background:(?:#0|rgba\(9,11,14)/i);
          assert.match(html,/<meta name="theme-color" content="#ECECEC">/);
          JS
      - run: npm run build:pages
      - name: Verify all scoreboard routes
        run: |
          for version in v1.0 v1.1 v1.2 v1.3; do test -f "out/scoreboard/$version/index.html"; done
          test -f out/v4.3.2.1/index.html
          test -f out/v4.3.2.2/index.html
          cmp public/scoreboard/v1.3/scoreboard.css out/scoreboard/v1.3/scoreboard.css
          cmp public/scoreboard/v1.3/scoreboard.js out/scoreboard/v1.3/scoreboard.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: scoreboard-ui-v13-w5-light-preview
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
