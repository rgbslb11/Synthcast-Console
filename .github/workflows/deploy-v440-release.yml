name: Publish GameCast 4.4.0 Week 6
on:
  push:
    branches: [release/gamecast-v4.4.0]
    paths:
      - scripts/*v440.mjs
      - release-assets/gamecast-v4.4.0/**
      - .github/workflows/deploy-v440-release.yml
      - GAMECAST_4_4_0_RELEASE.md
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gamecast-v440-pages
  cancel-in-progress: false
jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect baseline and scope
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/gamecast-v4.4.0
          test "$(git rev-parse origin/release/gamecast-v4.3.2.1)" = e6dbe1107ecb6542d41d156246f2209da31ca6c4
          git diff --exit-code e6dbe1107ecb6542d41d156246f2209da31ca6c4 -- public supabase package.json package-lock.json scripts/build-gamecast-v4321.mjs scripts/verify-gamecast-v4321.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-gamecast-v440.mjs
      - run: node scripts/verify-gamecast-v440.mjs --source-only
      - run: npm install --prefix "$RUNNER_TEMP/gamecast-qa" --no-audit --no-fund jsdom@26.1.0
      - name: Actual 4.4.0 entrypoint and console regressions
        env:
          GAMECAST_QA_MODULES: ${{ runner.temp }}/gamecast-qa
        run: node scripts/test-gamecast-v440.mjs
      - name: Reconcile deployed backend and both views
        env:
          GAMECAST_QA_MODULES: ${{ runner.temp }}/gamecast-qa
        run: node scripts/verify-gamecast-v440.mjs
      - name: Preserve live Pages bytes and add isolated route
        run: node scripts/preserve-gamecast-pages-v440.mjs restore out release-assets/gamecast-v4.4.0/preserved-pages-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: gamecast-v440-verification
          path: v440-evidence/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy-pages:
    needs: build-verify
    runs-on: ubuntu-latest
    environment:
      name: gamecast-v440-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
