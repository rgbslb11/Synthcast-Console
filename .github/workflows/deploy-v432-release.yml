name: Publish GameCast 4.3.2 Week 5 RC

on:
  push:
    branches: [release/gamecast-v4.3.2]
    paths:
      - scripts/build-gamecast-v432.mjs
      - scripts/verify-gamecast-v432-power.mjs
      - GAMECAST_4_3_2_RELEASE.md
      - .github/workflows/deploy-v432-release.yml
      - release-assets/gamecast-v4.3.2/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamecast-v432-release
  cancel-in-progress: false

jobs:
  build-test-publish-backend:
    runs-on: ubuntu-latest
    environment:
      name: gamecast-v422-supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: percrnamjzetzjjuxuuw
      FUNCTION_NAME: gamecast-week5-v4-3-2
    steps:
      - name: Checkout exact 4.3.2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify branch and prior-release protection
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/gamecast-v4.3.2
          git diff --exit-code origin/release/gamecast-v4.3.1 -- public supabase

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated 4.3.2 Week 5 source
        run: node scripts/build-gamecast-v432.mjs

      - name: Verify exact approved Week 5 power, schedule, isolation and controls
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-gamecast-v432-power.mjs --source-only
          grep -q 'GC-W5-V4.3.2-RC1' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'GAMECAST_V1_2_FCS60' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'w5v432-' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'gamecast-week5-v4-3-2' public/v4.3.2/app.js
          grep -q 'synthcastGameCast432Operator' public/v4.3.2/app.js
          grep -q 'WEEK 5 · 58 GAMES · 121/121 POST-W4 POWER' public/v4.3.2/index.html
          grep -q '60/60/60' public/v4.3.2/index.html
          grep -q 'PURGE UI + NEW SESSION' public/v4.3.2/index.html
          grep -q 'purgeUiNewSession' public/v4.3.2/app.js
          node --check public/v4.3.2/app.js
          node --check public/v4.3.2/patch-432.js

      - name: Run inherited fixed-seed engine regression
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let s=fs.readFileSync('scripts/test-gamecast-v422-engine.mjs','utf8');
          s=s.replace("const file='supabase/functions/gamecast-week3-v4-2-2/index.ts';","const file='supabase/functions/gamecast-week5-v4-3-2/index.ts';");
          s=s.replace('GameCast 4.2.2 engine regression PASS','GameCast 4.3.2 inherited engine regression PASS');
          fs.writeFileSync('scripts/.generated-test-gamecast-v432-engine.mjs',s);
          JS
          node scripts/.generated-test-gamecast-v432-engine.mjs | tee v432-engine-regression.log
          grep -q '"glSeconds":7541' v432-engine-regression.log
          grep -q '"plays":\[60,66\]' v432-engine-regression.log
          grep -q 'GameCast 4.3.2 inherited engine regression PASS' v432-engine-regression.log
          rm scripts/.generated-test-gamecast-v432-engine.mjs

      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/gamecast-v423-qa" --no-audit --no-fund jsdom@26.1.0

      - name: Re-run 4.2.3 UI interaction regression
        env:
          GAMECAST_QA_MODULES: ${{ runner.temp }}/gamecast-v423-qa
        run: node --test scripts/test-gamecast-v423-ui.mjs

      - name: Verify whether the authorized connected deployment is already present
        id: remote
        run: node --experimental-strip-types scripts/verify-gamecast-v432-power.mjs --probe

      - name: Publish isolated 4.3.2 Edge Function when deployment is required
        if: steps.remote.outputs.already_deployed != 'true'
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@latest functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Mandatory authenticated and public readback of all 58 games
        run: node --experimental-strip-types scripts/verify-gamecast-v432-power.mjs

      - name: Archive Week 5 rating and cloud-verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: gamecast-v432-week5-power-verification
          path: |
            v432-power-verification/
            v432-engine-regression.log

      - name: Build Pages site
        run: npm run build:pages

      - name: Verify 4.3.2 Pages route
        run: |
          test -f out/v4.3.2/index.html
          grep -q 'GAMECAST 4.3.2' out/v4.3.2/index.html
          grep -q 'WEEK 5 · 58 GAMES · 121/121 POST-W4 POWER' out/v4.3.2/index.html
          grep -q '60/60/60' out/v4.3.2/index.html
          grep -q 'PURGE UI + NEW SESSION' out/v4.3.2/index.html
          cmp --silent public/v4.3.2/app.js out/v4.3.2/app.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy-pages:
    needs: build-test-publish-backend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: gamecast-v432-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish 4.3.2
        id: deployment
        uses: actions/deploy-pages@v4
