name: Publish GameCast Week 14
on:
  push:
    branches: [development/w14-overtime]
    paths: ['.github/workflows/publish-w14-ot.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: gamecast-pages-preserved-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Week 14 candidate
        run: node --test tests/week14/*.test.mjs tests/v5085/*.test.mjs
      - name: Verify latest Pages publisher
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page:100});
            for (const run of runs.filter(r=>r.status==='completed' && /publish|deploy/i.test(r.name)).sort((a,b)=>b.id-a.id)) {
              const {data} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id});
              if (!data.jobs.some(job=>/publish|deploy/i.test(job.name) && job.conclusion==='success')) continue;
              if (run.id!==45321014603) throw Error('Published baseline changed: '+run.id);
              return;
            }
            throw Error('Published baseline missing');
      - run: node scripts/publish-w14-ot.mjs prepare
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-w14
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: gamecast-week14
      url: ${{ steps.deploy.outputs.page_url }}week14/
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
  hosted:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/publish-w14-ot.mjs verify
