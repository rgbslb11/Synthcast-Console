name: Publish Week 13 stats tracker
on:
  push:
    branches: [feature/w13-stats-tracker]
    paths: ['.github/workflows/publish-w13-stats-tracker.yml', 'public/stats-tracker/w13/**']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: gamecast-pages-preserved-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify publication baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page:100});
            for (const run of runs.filter(r => r.status === 'completed' && /publish|deploy/i.test(r.name)).sort((a,b)=>b.id-a.id)) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id});
              if (!data.jobs.some(j => /publish|deploy/i.test(j.name) && j.conclusion === 'success')) continue;
              if (run.id !== 44019096550 && run.path !== '.github/workflows/publish-w13-stats-tracker.yml') throw Error('Published baseline changed: '+run.id);
              return;
            }
            throw Error('Published baseline missing');
      - name: Check and preserve every existing Pages asset
        run: |
          node --check public/stats-tracker/w13/tracker.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const walk = dir => fs.readdirSync(dir,{withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(path.join(dir,entry.name)) : [path.join(dir,entry.name)]);
          const old = JSON.parse(fs.readFileSync('release-assets/v5.0.8-week13/pages-baseline.json')).files;
          const week = walk('public/v5.0.8/w13').map(file => ({path:file.slice(7),sha256:sha(fs.readFileSync(file))}));
          const inventory = [...old,...week];
          assert.equal(inventory.length,292);
          assert.equal(new Set(inventory.map(item=>item.path)).size,292);
          const base = 'https://rgbslb11.github.io/Synthcast-Console/';
          for(let i=0;i<inventory.length;i+=8) await Promise.all(inventory.slice(i,i+8).map(async item => {
            assert.ok(!item.path.startsWith('/') && !item.path.split('/').includes('..'));
            const response = await fetch(new URL(item.path,base),{cache:'no-store',signal:AbortSignal.timeout(25000)});
            assert.equal(response.status,200,item.path);
            const bytes = Buffer.from(await response.arrayBuffer());
            assert.equal(sha(bytes),item.sha256,item.path);
            const output = path.join('out',item.path);
            fs.mkdirSync(path.dirname(output),{recursive:true});
            fs.writeFileSync(output,bytes);
          }));
          fs.cpSync('public/stats-tracker/w13','out/stats-tracker/w13',{recursive:true});
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: gamecast-w13-stats-tracker
      url: ${{ steps.deploy.outputs.page_url }}stats-tracker/w13/
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
