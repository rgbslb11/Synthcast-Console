name: GameCast 5.0.1 isolated regression
on:
  push:
    branches: [release/gamecast-v5.0.1]
    paths: ['public/v5.0.1/**', 'release-assets/v5.0.1/**', 'tests/v501/**', '.github/workflows/qa-v501.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/v501/*.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/gamecast-browser" --save-exact playwright@1.62.1
      - run: node "$RUNNER_TEMP/gamecast-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/gamecast-browser/node_modules/playwright/index.mjs" node tests/v501/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecast-v501-test-evidence
          path: release-assets/gamecast-v5.0.1/evidence/
