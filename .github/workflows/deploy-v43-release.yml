name: Publish GameCast 4.3 Week 4 RC

on:
  push:
    branches: [release/gamecast-v4.3]
    paths:
      - scripts/build-gamecast-v43.mjs
      - release-assets/gamecast-v4.3/**
      - GAMECAST_4_3_RELEASE.md
      - .github/workflows/deploy-v43-release.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamecast-v43-release
  cancel-in-progress: false

jobs:
  build-test-publish-backend:
    runs-on: ubuntu-latest
    environment:
      name: gamecast-v422-supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: percrnamjzetzjjuxuuw
      FUNCTION_NAME: gamecast-week4-v4-3
    steps:
      - name: Checkout the exact 4.3 release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release branch and protect prior versions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/gamecast-v4.3
          git diff --exit-code 1b47af43d1d28ae2e3b937c0f845e6b501671c10 -- \
            public supabase \
            ':!public/v4.3' \
            ':!supabase/functions/gamecast-week4-v4-3'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build isolated 4.3 Week 4 source
        run: node scripts/build-gamecast-v43.mjs

      - name: Verify Week 4 schedule and quarantine boundary
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {WEEK4,OPERATING_SLATE} from './supabase/functions/gamecast-week4-v4-3/week4.ts';
          assert.equal(WEEK4.length,55);
          assert.equal(OPERATING_SLATE.length,55);
          assert.equal(new Set(WEEK4.map(g=>g.id)).size,55);
          assert.deepEqual(WEEK4.filter(g=>g.neutral).map(g=>g.id).sort(),['G0119','G0164']);
          const g142=WEEK4.find(g=>g.id==='G0142');
          assert.ok(g142);
          assert.deepEqual([g142.away,g142.home,g142.kickoff,g142.network],['Colorado','Northwestern','TBD','TV TBD']);
          const ids=WEEK4.map(g=>Number(g.id.slice(1))).sort((a,b)=>a-b);
          assert.equal(ids[0],115);assert.equal(ids.at(-1),169);
          console.log('PASS: Week 4 = 55 unique canonical games; G0142 carriage remains quarantined/TBD.');
          JS

      - name: Verify power carry-forward boundary
        run: |
          cmp --silent supabase/functions/gamecast-week3-v4-2-2/power.ts supabase/functions/gamecast-week4-v4-3/power.ts
          node --experimental-strip-types --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {WEEK4} from './supabase/functions/gamecast-week4-v4-3/week4.ts';
          import {TEAM_POWER} from './supabase/functions/gamecast-week4-v4-3/power.ts';
          const ready=p=>p&&Number.isFinite(p.offense)&&Number.isFinite(p.defense)&&Number.isFinite(p.overall);
          const n=WEEK4.filter(g=>ready(TEAM_POWER[g.away])&&ready(TEAM_POWER[g.home])).length;
          assert.equal(n,32);
          console.log('PASS: prior power sidecar unchanged; '+n+'/55 games preloaded power-ready and 23 intentionally pending.');
          JS

      - name: Verify 4.3 identity without football-logic drift
        run: |
          grep -q 'GC-W4-V4.3-RC1' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'const WEEK_KEY = "2026-W04"' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'w4v43-' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'OPERATING_SLATE.length !== 55' supabase/functions/$FUNCTION_NAME/index.ts
          grep -q 'functions/v1/gamecast-week4-v4-3' public/v4.3/app.js
          grep -q "synthcastGameCast43Operator" public/v4.3/app.js
          node --check public/v4.3/app.js
          node --check public/v4.3/patch-43.js

      - name: Run inherited fixed-seed engine regression on 4.3
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let s=fs.readFileSync('scripts/test-gamecast-v422-engine.mjs','utf8');
          s=s.replace("const file='supabase/functions/gamecast-week3-v4-2-2/index.ts';","const file='supabase/functions/gamecast-week4-v4-3/index.ts';");
          s=s.replace('GameCast 4.2.2 engine regression PASS','GameCast 4.3 inherited engine regression PASS');
          fs.writeFileSync('scripts/.generated-test-gamecast-v43-engine.mjs',s);
          JS
          node scripts/.generated-test-gamecast-v43-engine.mjs | tee v43-engine-regression.log
          grep -q '"glSeconds":7541' v43-engine-regression.log
          grep -q '"plays":\[60,66\]' v43-engine-regression.log
          grep -q 'GameCast 4.3 inherited engine regression PASS' v43-engine-regression.log
          rm scripts/.generated-test-gamecast-v43-engine.mjs

      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/gamecast-v423-qa" --no-audit --no-fund jsdom@26.1.0

      - name: Re-run 4.2.3 UI interaction regression
        env:
          GAMECAST_QA_MODULES: ${{ runner.temp }}/gamecast-v423-qa
        run: node --test scripts/test-gamecast-v423-ui.mjs

      - name: Publish isolated 4.3 Edge Function
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN repository/environment secret is not configured'; exit 2; }
          npx --yes supabase@latest functions deploy "$FUNCTION_NAME" \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt

      - name: Staging smoke and 55-game session verification
        run: |
          set -euo pipefail
          base="https://${PROJECT_REF}.supabase.co/functions/v1/${FUNCTION_NAME}"
          code=$(curl -sS -o smoke.json -w '%{http_code}' "$base?api=read&session=w4v43-publish-smoke")
          test "$code" = "404"
          grep -q 'GameCast 4.3 Week 4 session not found' smoke.json
          code=$(curl -sS -o create.json -w '%{http_code}' -X POST "$base?api=create" -H 'content-type: application/json' -d '{}')
          test "$code" = "201"
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('create.json','utf8'));
          assert.match(x.public_slug,/^w4v43-[0-9a-f]{16}$/);
          assert.equal(x.engine_version,'GC-W4-V4.3-RC1');
          assert.equal(x.governance.games,55);
          assert.equal(x.governance.week4_games,55);
          assert.equal(x.governance.power_ready,32);
          console.log('PASS: created staging slug '+x.public_slug);
          JS
          slug=$(node -e "const x=require('./create.json');process.stdout.write(x.public_slug)")
          curl -sS "$base?api=read&session=$slug" > read.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const x=JSON.parse(fs.readFileSync('read.json','utf8'));
          assert.equal(x.week_key,'2026-W04');assert.equal(x.engine_version,'GC-W4-V4.3-RC1');
          assert.equal(x.state.length,55);assert.equal(x.governance.power_ready,32);assert.equal(x.governance.power_pending,23);
          const g142=x.state.find(g=>g.id==='G0142');assert.deepEqual([g142.away.name,g142.home.name,g142.kickoff,g142.network],['Colorado','Northwestern','TBD','TV TBD']);
          assert.deepEqual(x.state.filter(g=>g.neutral).map(g=>g.id).sort(),['G0119','G0164']);
          assert.ok(x.state.every(g=>g.lifecycle==='UNLAUNCHED'));
          console.log('PASS: live 4.3 staging session contains 55 unlaunched Week 4 games, 32 power-ready / 23 pending.');
          JS

      - name: Build static site with 4.3 route
        run: npm run build:pages

      - name: Verify built 4.3 route
        run: |
          test -f out/v4.3/index.html
          grep -q 'GAMECAST 4.3' out/v4.3/index.html
          grep -q 'WEEK 4' out/v4.3/index.html
          cmp --silent public/v4.3/app.js out/v4.3/app.js
          cmp --silent public/v4.3/patch-43.js out/v4.3/patch-43.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy-pages:
    needs: build-test-publish-backend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: gamecast-v43-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish 4.3 from isolated release branch
        id: deployment
        uses: actions/deploy-pages@v4
