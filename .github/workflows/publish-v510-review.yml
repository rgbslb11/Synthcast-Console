name: Publish isolated 5.1 QA review preserving prior Pages
on:
  push:
    branches: [fix/v510-wp-board-ui]
    paths: ['release-assets/v5.1.0/review-publish-request.json']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: gamecast-pages-preserved-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve approved UI, engine and prior release source
        run: |
          git diff --exit-code bc8f0f029a4cf633e9a9d4e7351860e9177955a6 -- public app .openai release-assets/v5.1.0/backend release-assets/v5.0.6-week11 ':(exclude)public/v5.1.0/review/app.mjs' ':(exclude)public/v5.1.0/review/wp-transport.mjs' ':(exclude)public/v5.1.0/review/detail-view.mjs'
          node --test tests/v510-ui/*.test.mjs tests/v506/*.test.mjs tests/v510/*.test.mjs
      - name: Verify latest successful Pages publisher baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page: 100});
            const candidates = runs.filter(r => /publish|deploy/i.test(r.name) && r.status === 'completed' && r.id !== Number(context.runId)).sort((a,b) => b.id-a.id);
            let latest;
            for (const candidate of candidates) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: candidate.id});
              if (jobs.data.jobs.some(j => /publish|deploy/i.test(j.name) && j.conclusion === 'success')) { latest = candidate; break; }
              if (candidate.conclusion === 'success') throw new Error('Unrecognized successful publisher; verify baseline');
            }
            if (latest?.id !== 41985422038) throw new Error('Published baseline changed; reconstruct inventory before publishing');
      - run: npm install --prefix "$RUNNER_TEMP/preflight" --no-audit --no-fund --save-exact playwright@1.62.1
      - run: node "$RUNNER_TEMP/preflight/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Verify desktop fixes and mobile regression before publishing
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/preflight/node_modules/playwright/index.mjs
        run: |
          node tests/v510-ui/browser.mjs
          GAMECAST_BROWSER=webkit node tests/v510-ui/browser.mjs
      - run: node scripts/ui/publish-review.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: gamecast-v510-preserved-pages-backup
          path: out-v510-review
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: gamecast-v510-publication-manifest
          path: outputs/v510-hosted
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-v510-review
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: gamecast-v510-qa
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
  hosted:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ui/publish-review.mjs verify
      - run: npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --save-exact playwright@1.62.1
      - run: node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Hosted Chromium actual QA access
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
          GAMECAST_QA_EMAIL: ${{ secrets.GAMECAST_QA_EMAIL }}
          GAMECAST_QA_PASSWORD: ${{ secrets.GAMECAST_QA_PASSWORD }}
        run: node tests/v510-ui/hosted.mjs
      - name: Hosted WebKit actual QA access
        env:
          GAMECAST_BROWSER: webkit
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright/index.mjs
          GAMECAST_QA_EMAIL: ${{ secrets.GAMECAST_QA_EMAIL }}
          GAMECAST_QA_PASSWORD: ${{ secrets.GAMECAST_QA_PASSWORD }}
        run: node tests/v510-ui/hosted.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecast-v510-hosted-evidence
          path: outputs/v510-hosted
