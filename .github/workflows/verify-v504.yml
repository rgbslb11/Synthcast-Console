name: Verify GameCast 5.0.4 Week 10 candidate
on:
  push:
    branches: [release/gamecast-v5.0.4]
    paths: ['public/v5.0.4/**', 'release-assets/v5.0.4-week10/**', 'tests/v504/**', 'scripts/prepare-v504.mjs', '.github/workflows/verify-v504.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify prior releases are unchanged
        run: git diff --exit-code 17e3809730351301ae71cce5f127deb78c08bfec -- public/v5.0.3 release-assets/v5.0.3-week9 supabase
      - name: Verify reproducible preparation
        run: |
          node scripts/prepare-v504.mjs
          git diff --exit-code -- public/v5.0.4 release-assets/v5.0.4-week10
      - run: mkdir -p outputs/v504
      - run: node --test tests/v504/*.test.mjs | tee outputs/v504/logic-tests.txt
      - run: npm install --prefix "$RUNNER_TEMP/gamecast-browser" --save-exact playwright@1.62.1
      - run: node "$RUNNER_TEMP/gamecast-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Chromium Chairman, public and condensed UI
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gamecast-browser/node_modules/playwright/index.mjs
        run: |
          node tests/v504/week10-browser.mjs
          node tests/v504/finished-ot-browser.mjs
          node tests/v504/final-ot-status-browser.mjs
      - name: WebKit mobile viewport
        env:
          GAMECAST_BROWSER: webkit
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/gamecast-browser/node_modules/playwright/index.mjs
        run: |
          node tests/v504/week10-browser.mjs
          node tests/v504/finished-ot-browser.mjs
          node tests/v504/final-ot-status-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamecast-v504-candidate-verification
          path: outputs/v504/
