name: Publish GameCast 5.1 Week 14
on:
  push:
    branches: [release/gamecast-v5.1.0-week14]
    paths:
      - '.github/workflows/publish-v510-week14.yml'
      - 'scripts/publish-v510-week14.mjs'
      - 'public/v5.1.0/week14/**'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: gamecast-pages-preserved-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the new operator endpoint requires sign-in
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://xsvdmcipviejxynkdbhq.supabase.co/functions/v1/gamecast-v5-1-week14?action=board')
          test "$code" = 401
      - name: Locate latest successful Pages publication
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, per_page: 100});
            for (const run of runs.filter(r => r.status === 'completed' && /publish|deploy/i.test(r.name)).sort((a,b) => b.id-a.id)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: run.id});
              if (!jobs.some(j => /publish|deploy/i.test(j.name) && j.conclusion === 'success' && j.steps?.some(s => /deploy-pages/i.test(s.name) && s.conclusion === 'success'))) continue;
              core.setOutput('run', String(run.id));
              return;
            }
            throw Error('No successful Pages publication found');
      - name: Retrieve prior Pages bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ steps.pages.outputs.run }}
        run: |
          mkdir -p prior out-week14
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name github-pages --dir prior
          test -f prior/artifact.tar
          tar -xf prior/artifact.tar -C out-week14
      - name: Verify existing Pages and add the Chairman UI
        run: node scripts/publish-v510-week14.mjs prepare
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-week14
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: gamecast-week14
      url: ${{ steps.deploy.outputs.page_url }}v5.1.0/week14/
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/publish-v510-week14.mjs verify
