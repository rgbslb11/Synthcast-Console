name: Deploy GameCast 4.2.2 Preview

on:
  push:
    branches:
      - release/gamecast-v4.2.2
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamecast-v422-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GameCast 4.2.2 branch
        uses: actions/checkout@v4
        with:
          ref: release/gamecast-v4.2.2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate corrective 4.2.2 package
        run: |
          node scripts/build-gamecast-v422.mjs
          node scripts/wire-gamecast-v422-ui.mjs
      - name: Verify reported-defect corrections
        run: |
          test -f supabase/functions/gamecast-week3-v4-2-2/index.ts
          test -f supabase/functions/gamecast-week3-v4-2-2/power.ts
          test -f supabase/functions/gamecast-week3-v4-2-2/week3.ts
          test -f public/v4.2.2/index.html
          test -f public/v4.2.2/app.js
          test -f public/v4.2.2/patch-422.js
          grep -q 'if (g.pendingPeriod !== 0) advancePeriod(g);' supabase/functions/gamecast-week3-v4-2-2/index.ts
          grep -q 'invalid score period' supabase/functions/gamecast-week3-v4-2-2/index.ts
          grep -q 'invalid pending period transition' supabase/functions/gamecast-week3-v4-2-2/index.ts
          grep -q 'GC-W3-V4.2.2-RC1' supabase/functions/gamecast-week3-v4-2-2/index.ts
          grep -q 'gamecast-week3-v4-2-2' public/v4.2.2/app.js
          grep -q 'synthcastGameCast422Operator' public/v4.2.2/app.js
          if grep -q 'if (g.breakSeconds === 0) advancePeriod(g)' supabase/functions/gamecast-week3-v4-2-2/index.ts; then exit 1; fi
          if grep -q 'shim-422.js' public/v4.2.2/index.html; then exit 1; fi
          if grep -q '../v4.2/app.js' public/v4.2.2/index.html; then exit 1; fi
          cmp supabase/functions/gamecast-week3-v4-2-1/power.ts supabase/functions/gamecast-week3-v4-2-2/power.ts
          cmp supabase/functions/gamecast-week3-v4-2-1/week3.ts supabase/functions/gamecast-week3-v4-2-2/week3.ts
      - name: Run 4.2.2 reported-defect regression
        run: node scripts/test-gamecast-v422-engine.mjs
      - name: Run 4.2.2 broader backend audit
        run: node scripts/audit-gamecast-v422.mjs
      - name: Run 4.2.2 multi-seed structural calibration
        run: node scripts/calibrate-gamecast-v422.mjs
      - name: Run 4.2.2 full Week 3 power-board audit
        run: node scripts/audit-gamecast-v422-week3.mjs
      - name: Commit generated 4.2.2 package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v4.2.2 supabase/functions/gamecast-week3-v4-2-2
          if ! git diff --cached --quiet; then
            git commit -m "Generate GameCast 4.2.2 corrective package"
            git push origin HEAD:release/gamecast-v4.2.2
          fi
      - name: Build static GameCast
        run: npm run build:pages
      - name: Verify 4.2.2 Pages surface
        run: |
          test -f out/v4.2.1/index.html
          test -f out/v4.2.2/index.html
          test -f out/v4.2.2/app.js
          test -f out/v4.2.2/patch-422.js
          grep -q 'GAMECAST 4.2.2' out/v4.2.2/index.html
          grep -q 'gamecast-week3-v4-2-2' out/v4.2.2/app.js
          if grep -q 'shim-422.js' out/v4.2.2/index.html; then exit 1; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    environment:
      name: gamecast-v422-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
