name: QA Scoreboard Current Live Session

on:
  push:
    branches: [release/scoreboard-ui-v1.0]
    paths:
      - .github/workflows/qa-scoreboard-live-session.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current public GameCast session
        env:
          SESSION: w3v422-18fdc6e5c55bcef8
          API: https://percrnamjzetzjjuxuuw.supabase.co/functions/v1/gamecast-week3-v4-2-2
        run: |
          set -euo pipefail
          curl -sS -D headers.txt -o body.json -w '%{http_code}' "$API?api=read&session=$SESSION" > status.txt
          echo "HTTP $(cat status.txt)"
          cat body.json
          test "$(cat status.txt)" = "200"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('body.json','utf8'));
          if(!Array.isArray(x.state)) throw new Error('state missing');
          console.log(`SESSION ${x.public_slug} ENGINE ${x.engine_version} GAMES ${x.state.length} V${x.state_version}`);
          JS
