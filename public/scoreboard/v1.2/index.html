<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Synthcast Scoreboard 1.2 | Week 5</title>
  <link rel="stylesheet" href="scoreboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brandline">
      <div class="brand">SYNTHCAST <b>SCOREBOARD</b></div>
      <div class="version">UI 1.2 · DUAL ENGINE</div>
    </div>
    <div class="statusline">
      <span id="weekLabel">WEEK 5</span>
      <span id="localTime">--:--</span>
      <span id="syncDot" class="sync-dot" aria-hidden="true"></span>
      <span id="syncText">NO SESSION</span>
    </div>
  </header>

  <main>
    <nav class="engine-tabs" role="tablist" aria-label="GameCast engine">
      <button type="button" role="tab" id="satEngineTab" aria-selected="true" aria-controls="boardContent" data-engine="saturday" class="active">SATURDAY ENGINE <small>4.3.2.2</small></button>
      <button type="button" role="tab" id="weekEngineTab" aria-selected="false" aria-controls="boardContent" data-engine="full">FULL WEEK ENGINE <small>4.3.2.1</small></button>
    </nav>

    <div id="boardContent" role="tabpanel" aria-labelledby="satEngineTab">
    <section class="summary" aria-label="Scoreboard summary">
      <div><b id="liveCount">0</b><span>LIVE</span></div>
      <div><b id="finalCount">0</b><span>FINAL</span></div>
      <div><b id="upcomingCount">0</b><span>UPCOMING</span></div>
      <div><b id="delayCount">0</b><span>DELAY</span></div>
    </section>

    <nav class="filters" aria-label="Scoreboard filters">
      <button type="button" data-filter="ALL" class="active">ALL</button>
      <button type="button" data-filter="LIVE">LIVE</button>
      <button type="button" data-filter="FINAL">FINAL</button>
      <button type="button" data-filter="UPCOMING">UPCOMING</button>
      <button type="button" id="networkToggle" aria-pressed="false">SEN / EBC</button>
    </nav>

    <section id="sessionNotice" class="session-notice">
      Connecting to both public Week 5 sessions...
    </section>

    <h2 id="satHeading" class="section-heading">SATURDAY · 49 GAMES <span>GAMECAST 4.3.2.2</span></h2>
    <section id="scoreboard" class="scoreboard" aria-live="polite"></section>
    <h2 class="section-heading earlier-heading">THURSDAY &amp; FRIDAY · 9 GAMES <span>GAMECAST 4.3.2.1</span></h2>
    <section id="earlierBoard" class="scoreboard earlier-board" aria-live="polite"></section>
    </div>
  </main>

  <template id="emptyTemplate">
    <div class="empty-state">No games match this view.</div>
  </template>

  <script src="scoreboard.js"></script>
</body>
</html>
